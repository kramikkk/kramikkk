name: Update 3D Contribution Graph

on:
  schedule:
    - cron: "30 0 * * *" # Daily at 00:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-3d-contrib:
    runs-on: ubuntu-latest
    name: Generate monochrome 3D contribution graph
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-monochrome.svg
          if git diff --staged --quiet; then
            echo "No 3D contribution graph changes to commit"
          else
            git commit -m "Update 3D contribution graph"
            git pull --rebase origin main
            git push
          fi
