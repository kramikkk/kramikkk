name: Update Space Shooter Game

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 2 # This is crucial!

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Generate Space Shooter Game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install gh-space-shooter pillow
          gh-space-shooter "${{ github.repository_owner }}" --output game-color.gif --strategy random
          python scripts/monochrome_gif.py game-color.gif assets/game.gif
          rm game-color.gif

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game.gif

          if git diff --staged --quiet; then
            echo "No Space Shooter changes to commit"
          else
            git commit -m "Update space shooter game GIF"
            git pull --rebase origin main
            git push
          fi
